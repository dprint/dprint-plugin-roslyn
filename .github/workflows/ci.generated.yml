# GENERATED BY ./ci.ts -- DO NOT DIRECTLY EDIT

name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  build:
    name: test_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Test
        run: dotnet test
      - name: Install WASI SDK
        run: |-
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-29.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build Wasm
        run: |-
          dotnet publish DprintPluginRoslyn -c Release -r wasi-wasm
          cp DprintPluginRoslyn/bin/Release/net10.0/wasi-wasm/publish/dprint-plugin-roslyn.wasm plugin.wasm
      - name: Install dprint
        run: |-
          curl -fsSL https://dprint.dev/install.sh | sh
          echo "DPRINT_PATH=$HOME/.dprint/bin/dprint" >> "$GITHUB_ENV"
      - name: Test Wasm
        env:
          DPRINT_ROSLYN_WASM_PATH: '${{ github.workspace }}/plugin.wasm'
        run: dotnet test --filter TestCategory=Wasm
      - name: Get tag version
        id: get_tag_version
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'echo TAG_VERSION=${GITHUB_REF/refs\/tags\//} >> $GITHUB_OUTPUT'
      - name: Build npm package
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: deno run -A scripts/create_npm_package.ts
      - name: Create release notes
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: 'deno run -A ./scripts/generate_release_notes.ts ${{ steps.get_tag_version.outputs.TAG_VERSION }} > ${{ github.workspace }}-CHANGELOG.txt'
      - name: Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        if: 'startsWith(github.ref, ''refs/tags/'')'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          files: plugin.wasm
          body_path: '${{ github.workspace }}-CHANGELOG.txt'
          draft: false
      - name: Upgrade npm
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: npm install --global npm@latest
      - name: Publish npm package
        if: 'startsWith(github.ref, ''refs/tags/'')'
        run: npm publish --access public --provenance npm-dist
