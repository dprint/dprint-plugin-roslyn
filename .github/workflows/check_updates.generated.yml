    - cron: 0 7 * * 2
jobs:
  build:
    name: check updates
    if: github.repository == 'dprint/dprint-plugin-roslyn'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
